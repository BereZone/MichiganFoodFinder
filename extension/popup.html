<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { font: 13px system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 5px 6px; }
    button { margin-top: 12px; width: 100%; padding: 7px; font-weight: 600; cursor: pointer; }
    #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f1f5f9; min-height: 2.2em; white-space: pre-wrap; word-break: break-word; }
    #status.error { background: #fee2e2; }
    #status.done { background: #dcfce7; }
    .hint { color: #64748b; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
<h1>Michigan Food Finder — Menu Relay</h1>

<label for="url">Ingest URL</label>
<input id="url" type="url" placeholder="https://your-site.vercel.app/api/ingest">

<label for="token">Ingest token</label>
<input id="token" type="password" placeholder="paste your INGEST_TOKEN">
<div class="hint">Must match the INGEST_TOKEN env var on Vercel.</div>

<button id="sync">Sync now</button>
<div id="status">No sync yet.</div>

<script src="popup.js"></script>
</body>
</html>
