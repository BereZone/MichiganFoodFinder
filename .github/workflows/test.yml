name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile scrape_menus.py

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  api:
    name: API syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check serverless functions, local server, and extension
        run: |
          node --check api/menus.js
          node --check api/ingest.js
          node --check local-server.js
          node --check extension/background.js
          node --check extension/parser.js
          node --check extension/offscreen.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build (includes tsc)
        working-directory: client
        run: |
          npm ci
          npm run build
