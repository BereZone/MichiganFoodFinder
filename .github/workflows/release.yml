name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag is well-formed semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (did an extra 'v' sneak in?)"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check project metadata is updated
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          FAIL=0
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($VERSION)"
            FAIL=1
          fi
          if [ "$LOCK" != "$VERSION" ]; then
            echo "::error::package-lock.json version ($LOCK) does not match tag ($VERSION) — run 'npm install --package-lock-only'"
            FAIL=1
          fi
          exit $FAIL

      - name: Extract changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ env.VERSION }}
          path: ./CHANGELOG.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changes }}
          draft: true
