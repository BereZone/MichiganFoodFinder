name: Scrape Menus

on:
  # Schedule paused 2026-07-14: dining.umich.edu now serves a Cloudflare
  # challenge to all non-browser clients, so scraping returns 0 items.
  # Re-enable the cron below once the official Dining API access lands
  # (see docs/setup.md and the tracking notes in the repo).
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  actions: write # required by the keep-alive step to re-enable this workflow

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape menus into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scrape_menus.py

      # GitHub pauses scheduled workflows after 60 days without repo activity;
      # re-enabling the workflow via the API resets that timer so the schedule
      # never dies. gh is preinstalled on runners; idempotent if already enabled.
      - name: Keep workflow alive
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update_menus.yml/enable"
