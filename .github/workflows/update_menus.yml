name: Scrape Menus

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  actions: write # required by the keep-alive step to re-enable this workflow

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape menus into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scrape_menus.py

      # GitHub pauses scheduled workflows after 60 days without repo activity;
      # this re-enables the workflow via the API so the schedule never dies.
      - name: Keep workflow alive
        if: ${{ always() }}
        uses: gautamkrishnar/keepalive-workflow@v2
